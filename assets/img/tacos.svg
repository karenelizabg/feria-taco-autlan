<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="340" height="340" viewBox="0 0 340 340">
  <!-- Patrón de fondo: tacos de línea, girados y dispersos. Se repite cada 340 px;
       la opacidad baja (.09) lo deja como textura sutil sobre el crema. -->
  <defs>
    <!-- Taco: tortilla en domo con base plana y manchitas, y la lechuga asomándose por detrás -->
    <g id="taco">
      <path d="M-30 14A30 26 0 0 1 30 14Q30 17 27 17H-27Q-30 17-30 14Z"/>
      <path d="M-30 17A4.2 4.2 0 0 1-37.9 12.1A9.8 9.8 0 0 1-32.2-5.6A10.5 10.5 0 0 1-19.6-17.7A8.4 8.4 0 0 1-4-22.8A11.2 11.2 0 0 1 15.5-19.8A9.5 9.5 0 0 1 29.9-8.8A13.8 13.8 0 0 1 37.9 12.1A4.2 4.2 0 0 1 30 17"/>
      <g fill="#10432A" stroke="none">
        <circle cx="-20" cy="8" r="1.4"/>
        <circle cx="-12" cy="-2" r="1.3"/>
        <circle cx="-10" cy="9" r="2.1"/>
        <circle cx="1" cy="2" r="2.6"/>
        <circle cx="2" cy="-8" r="1.4"/>
        <circle cx="12" cy="-3" r="1.6"/>
        <circle cx="20" cy="6" r="1.9"/>
        <circle cx="9" cy="11" r="1.3"/>
      </g>
    </g>
  </defs>
  <g fill="none" stroke="#10432A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".09">
    <use xlink:href="#taco" href="#taco" transform="translate(71 65) rotate(-16) scale(.75)"/>
    <use xlink:href="#taco" href="#taco" transform="translate(250 62) rotate(12) scale(.7)"/>
    <use xlink:href="#taco" href="#taco" transform="translate(156 176) rotate(-6) scale(.75)"/>
    <use xlink:href="#taco" href="#taco" transform="translate(290 200) rotate(18) scale(.7)"/>
    <use xlink:href="#taco" href="#taco" transform="translate(68 283) rotate(10) scale(.72)"/>
    <use xlink:href="#taco" href="#taco" transform="translate(220 300) rotate(-20) scale(.75)"/>
  </g>
</svg>
